[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-inspect"
version = "0.1.0"
description = "Read-only metadata inspector for model files"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
model-inspect = "model_inspect.cli:main"

[tool.setuptools]
packages = ["model_inspect"]
